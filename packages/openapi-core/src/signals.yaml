openapi: 3.1.0
info:
  title: Signals API
  version: 0.1.0
  description: |
    Ingested practitioner messages, severity opinions, and vulnerability binding.
    Content is scored for asserted threat before binding is attempted.
  license:
    name: Proprietary
    url: https://chattermark.local/license
  x-domain: sig
  x-product-slug: ai-cyber-chattermark
servers:
  - url: https://api.chattermark.local
    description: Chattermark API

security:
  - bearerAuth: []
tags:
  - name: Signals
    description: Ingested practitioner messages, severity opinions, and vulnerability binding
paths:
  /v1/signals:
    get:
      operationId: listSignals
      tags: [Signals]
      summary: List signals
      security:
        - bearerAuth: []
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/Cursor
        - $ref: ./common/parameters.yaml#/components/parameters/Limit
        - name: vulnerabilityId
          in: query
          schema:
            type: string
        - name: bindingStatus
          in: query
          schema:
            type: string
            enum: [bound, held_ambiguous, unbound]
        - name: minSeverityOpinion
          in: query
          schema:
            type: number
            format: float
      responses:
        '200':
          description: Signals page
          content:
            application/json:
              schema:
                $ref: ./signals.schemas.yaml#/components/schemas/SignalListResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
    post:
      operationId: ingestSignal
      tags: [Signals]
      summary: Ingest a practitioner signal
      x-repository: Signal
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./signals.schemas.yaml#/components/schemas/SignalIngest
      responses:
        '202':
          description: Signal accepted for scoring
          content:
            application/json:
              schema:
                $ref: ./signals.schemas.yaml#/components/schemas/SignalResponse
        '422':
          $ref: ./common/responses.yaml#/components/responses/UnprocessableEntity
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
  /v1/signals/{signalId}:
    parameters:
      - name: signalId
        in: path
        required: true
        schema:
          $ref: ./signals.schemas.yaml#/components/schemas/SignalId
    get:
      operationId: getSignal
      tags: [Signals]
      summary: Get a signal
      x-repository: Signal
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Signal with opinion and binding
          content:
            application/json:
              schema:
                $ref: ./signals.schemas.yaml#/components/schemas/SignalResponse
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
  /v1/signals/{signalId}/binding:
    parameters:
      - name: signalId
        in: path
        required: true
        schema:
          $ref: ./signals.schemas.yaml#/components/schemas/SignalId
    put:
      operationId: resolveSignalBinding
      tags: [Signals]
      summary: Resolve ambiguous vulnerability binding
      x-repository: none
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./signals.schemas.yaml#/components/schemas/VulnerabilityBindingResolve
      responses:
        '200':
          description: Binding resolved
          content:
            application/json:
              schema:
                $ref: ./signals.schemas.yaml#/components/schemas/VulnerabilityBindingResponse
        '422':
          $ref: ./common/responses.yaml#/components/responses/UnprocessableEntity
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

components:
  securitySchemes:
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
    bearerAuth:
      $ref: ./common/security.yaml#/components/securitySchemes/bearerAuth
