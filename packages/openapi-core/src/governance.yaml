openapi: 3.1.0
info:
  title: Governance API
  version: 0.1.0
  description: |
    Escalation policy and change logging.
  license:
    name: Proprietary
    url: https://chattermark.local/license
  x-domain: gov
  x-product-slug: ai-cyber-chattermark
servers:
  - url: https://api.chattermark.local
    description: Chattermark API

security:
  - bearerAuth: []
tags:
  - name: Governance
    description: Escalation policy and change logging
paths:
  /v1/governance/escalation-policy:
    get:
      operationId: getEscalationPolicy
      tags: [Governance]
      summary: Get escalation policy
      x-repository: EscalationPolicy
      responses:
        '200':
          description: Escalation policy
          content:
            application/json:
              schema:
                $ref: ./governance.schemas.yaml#/components/schemas/EscalationPolicyResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
    put:
      operationId: updateEscalationPolicy
      tags: [Governance]
      summary: Update escalation policy
      x-repository: EscalationPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./governance.schemas.yaml#/components/schemas/EscalationPolicy
      responses:
        '200':
          description: Updated policy
          content:
            application/json:
              schema:
                $ref: ./governance.schemas.yaml#/components/schemas/EscalationPolicyResponse
        '422':
          $ref: ./common/responses.yaml#/components/responses/UnprocessableEntity
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
  /v1/governance/audit-events:
    get:
      operationId: listAuditEvents
      tags: [Governance]
      summary: List audit events
      x-repository: AuditEvent
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/Cursor
        - $ref: ./common/parameters.yaml#/components/parameters/Limit
      responses:
        '200':
          description: Audit events
          content:
            application/json:
              schema:
                $ref: ./governance.schemas.yaml#/components/schemas/AuditEventListResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

components:
  securitySchemes:
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
    bearerAuth:
      $ref: ./common/security.yaml#/components/securitySchemes/bearerAuth
